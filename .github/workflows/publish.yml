name: Publish directly downloadable NetHack guide APK

on:
  workflow_run:
    workflows: ["Build NetHack 5 with ChatGPT guide"]
    types: [completed]

permissions:
  contents: write
  actions: read

# Multiple in-flight build runs must not overwrite a newer APK with an old one.
concurrency:
  group: nethack-guide-preview-publication
  cancel-in-progress: false

jobs:
  preview-release:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    steps:
      - name: Reject stale source commits before downloading
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          latest="$(gh api "repos/$GH_REPO/commits/main" --jq '.sha')"
          if [ "$latest" != "$SOURCE_SHA" ]; then
            echo "Build $SOURCE_SHA is stale; repository HEAD is $latest. No release published."
            echo 'PUBLISH_SKIP=1' >> "$GITHUB_ENV"
          fi

      - name: Download built debug APK
        if: ${{ env.PUBLISH_SKIP != '1' }}
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: NetHack5-Guide-arm64-stable-signed-debug
          path: artifact/debug

      - name: Verify APK archives
        if: ${{ env.PUBLISH_SKIP != '1' }}
        shell: bash
        run: |
          set -euo pipefail
          debug="$(find artifact/debug -name '*.apk' -print -quit)"
          test -n "$debug"
          unzip -t "$debug" > /dev/null

      - name: Publish direct APK assets in a preview release
        if: ${{ env.PUBLISH_SKIP != '1' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view guide-preview > /dev/null 2>&1; then
            gh release create guide-preview --target main --prerelease \
              --title 'NetHack 5 ChatGPT Guide (preview)' \
              --notes 'NetHack 5 experimental Guide. From the first private-key-signed build onward, future versions use the same certificate and support normal updates. OLD app-arm64-v8a-debug.apk releases used disposable CI keys and require a one-time signed-key migration. Always back up saves before migrating.'
          fi
          debug="$(find artifact/debug -name '*.apk' -print -quit)"
          gh release upload guide-preview "$debug#NetHack5-Guide-arm64-updateable.apk" --clobber
          gh release edit guide-preview --notes 'Current NetHack 5 Guide preview (ARM64), signed with your persistent private key. Once an initial migration from old ephemeral debug certificates is complete, subsequent updates preserve game data. OLD app-arm64-v8a-debug.apk used a disposable signature and cannot be upgraded in place. Read the README migration instructions. Physical-device testing still required.'
