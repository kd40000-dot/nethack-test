name: Build offline NetHack Tutorial Mode APK

on:
  push:
    branches: [tutorial-mode-build]
    paths:
      - 'build/tutorial-sources.tar.xz'
      - '.github/workflows/tutorial-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nethack-tutorial-mode-test
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    env:
      NETHACK_STABLE_KEYSTORE: ${{ github.workspace }}/guide/signing/tutorial-update-test.p12
      NETHACK_STABLE_PASSWORD: NetHack-Tutorial-Public-Test-Key-2026
    timeout-minutes: 90
    steps:
      - name: Check out tutorial source bundle
        uses: actions/checkout@v4
        with:
          path: guide

      - name: Check out pinned NetHack 5 game source
        uses: actions/checkout@v4
        with:
          repository: JodiJodington/NetHack-Android
          ref: f7c0d7851b854cc7b1ca09b2c193e8620f2962d9
          submodules: false
          path: upstream

      - name: Require the same long-lived test signing identity
        shell: bash
        run: |
          set -euo pipefail
          test -s "$NETHACK_STABLE_KEYSTORE"
          sha256sum "$NETHACK_STABLE_KEYSTORE"
          keytool -exportcert -keystore "$NETHACK_STABLE_KEYSTORE" \
            -storepass "$NETHACK_STABLE_PASSWORD" -alias nethack-tutorial \
            -file "$RUNNER_TEMP/tutorial-identity.der" > /dev/null
          cert="$(openssl x509 -inform DER -in "$RUNNER_TEMP/tutorial-identity.der" \
            -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$cert" = "ab65aa9dd3984387346d15cdc20f388487457a32acba5e93f65d114beb4bd1dc"
          echo "Pinned NetHack tutorial update identity verified: $cert"

      - name: Verify and apply the offline tutorial patch
        run: |
          set -euo pipefail
          test -s guide/build/tutorial-sources.tar.xz
          echo '2384cdc77478b60bd55bbd6c3db9583185d92c42be105e568637670dcc85ea28  guide/build/tutorial-sources.tar.xz' | sha256sum -c -
          mkdir -p guide/tutorial
          tar -xJf guide/build/tutorial-sources.tar.xz -C guide/tutorial
          python3 guide/tutorial/tools/apply_to_upstream.py upstream
          grep -Fq 'com.tbd.nethack5.guide' upstream/sys/android/app/res/values/config.xml
          python3 -m py_compile guide/tutorial/tools/apply_to_upstream.py
          grep -q com.tbd.NetHack5.tutorial.TutorialActivity upstream/sys/android/app/AndroidManifest.xml
          grep -q "versionCode = 50043" upstream/sys/android/app/build.gradle
          if grep -R -q -E 'chatgpt.com|api.openai.com|api.github.com|raw.githubusercontent.com' upstream/sys/android/app/src; then
            echo 'Notice: unexpected online integration URL in tutorial application sources'
            exit 1
          fi

      - name: Install native build packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-multilib bison flex make

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: upstream/sys/android/gradle/wrapper/gradle-wrapper.properties

      - name: Generate real NetHack 5 weapon and projectile stats
        shell: bash
        run: |
          set -euo pipefail
          python3 guide/tutorial/tools/generate_weapon_stats.py upstream
          grep -q '"elven arrow"' upstream/sys/android/app/src/com/tbd/NetHack5/tutorial/WeaponStats.java
          grep -q '"1d7","1d6"' upstream/sys/android/app/src/com/tbd/NetHack5/tutorial/WeaponStats.java

      - name: Test global help lookup and unidentified item safety
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tutorial-unit-classes"
          src=guide/tutorial/app/src/main/java/com/tbd/NetHack5/tutorial
          javac -encoding UTF-8 -d "$RUNNER_TEMP/tutorial-unit-classes" \
            "$src/WikiLibrary.java" "$src/GroundMessage.java" "$src/TutorialEngine.java" "$src/FloorActionGuard.java" \
            upstream/sys/android/app/src/com/tbd/NetHack5/tutorial/WeaponStats.java \
            guide/tutorial/tests/{WikiLibraryTest,GroundMessageTest,HelpResolverTest,TutorialEngineTest,ContextPriorityTest,FloorActionGuardTest,ContextualDoorTest}.java
          for clazz in WikiLibraryTest com.tbd.NetHack5.tutorial.GroundMessageTest \
                       com.tbd.NetHack5.tutorial.HelpResolverTest TutorialEngineTest \
                       com.tbd.NetHack5.tutorial.ContextPriorityTest \
                       com.tbd.NetHack5.tutorial.FloorActionGuardTest \
                       com.tbd.NetHack5.tutorial.ContextualDoorTest; do
            java -cp "$RUNNER_TEMP/tutorial-unit-classes" "$clazz"
          done
          python3 -m compileall -q guide/tutorial/tools
          python3 - <<'PY'
          import runpy
          t=runpy.run_path('guide/tutorial/tests/test_context_priority.py')
          for name,func in t.items():
              if name.startswith('test_') and callable(func): func()
          print('PASS: contextual prioritization and secondary feature UI')
          PY
          python3 - <<'PY'
          import runpy
          for filename in ('test_theme_and_tiles.py','test_overlay.py'):
              test=runpy.run_path('guide/tutorial/tests/'+filename)
              for name,fn in test.items():
                  if name.startswith('test_') and callable(fn): fn()
          print('PASS: native dialogs, menu themes, tilesets and patch overlay')
          PY
          python3 - <<'PY'
          import runpy
          tests=runpy.run_path('guide/tutorial/tests/test_player_and_prompt.py')
          for name,func in tests.items():
              if name.startswith('test_') and callable(func): func()
          print('PASS: no player marker, native ring removal repaint, and prompt detection')
          PY
          python3 - <<'PY'
          import runpy
          from pathlib import Path
          test=runpy.run_path('guide/tutorial/tests/test_door_command.py')
          for name,fun in test.items():
              if name.startswith('test_') and callable(fun):fun()
          cmd=Path('upstream/src/cmd.c').read_text()
          assert "M('u'), \"untrap\"" in cmd, "NetHack upstream binding changed"
          print('PASS: atomic Meta+U door untrap, no exit/quit sequence')
          PY
          python3 - <<'PY'
          import runpy
          path='guide/tutorial/tests/test_pickup_state.py'
          tests=runpy.run_path(path)
          for name,fun in tests.items():
              if name.startswith('test_') and callable(fun): fun()
          print('PASS: stale pickup prevention and multi-item pile recheck')
          PY
          python3 - <<'PY'
          import glob,runpy
          count=0
          for filename in glob.glob('guide/tutorial/tests/test_*.py'):
              tests=runpy.run_path(filename)
              for name,func in tests.items():
                  if name.startswith('test_') and callable(func):
                      func()
                      count+=1
          assert count>=40, "Missing audit coverage"
          print('PASS: full tutorial UX audit ('+str(count)+' Python checks)')
          PY
      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 9123335
          packages: 'platforms;android-36 ndk;30.0.14904198 build-tools;36.0.0'

      - name: Compile NetHack 5 ARM64 native game engine
        working-directory: upstream
        run: |
          sed -i -e "s,NDK = .*,NDK = $ANDROID_HOME/ndk/30.0.14904198,g" sys/android/Makefile.src sys/android/Makefile.top
          sed -i -e 's,ABI = .*,ABI = arm64-v8a,g' sys/android/Makefile.src sys/android/Makefile.top
          (cd sys/android && sh ./setup.sh)
          make fetch-lua
          make install

      - name: Generate accurate monster tile catalog from compiled NetHack 5
        run: |
          python3 guide/tutorial/tools/generate_monster_catalog.py upstream
          grep -q '"fox"' upstream/sys/android/app/src/com/tbd/NetHack5/tutorial/MonsterCatalog.java
          grep -q '"kitten"' upstream/sys/android/app/src/com/tbd/NetHack5/tutorial/MonsterCatalog.java

      - name: Generate the ground-object tile catalog from real native graphics
        shell: bash
        run: |
          python3 guide/tutorial/tools/generate_object_catalog.py upstream
          grep -q 'boolean isGroundObjectTile' upstream/sys/android/app/src/com/tbd/NetHack5/tutorial/ObjectCatalog.java
          python3 guide/tutorial/tools/test_object_catalog.py
          
      - name: Build offline Tutorial Mode Android APK
        working-directory: upstream/sys/android
        run: bash ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify ARM64 APK ZIP and signing
        shell: bash
        working-directory: upstream/sys/android
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/debug -name '*arm64*v8a*.apk' -print -quit)"
          test -n "$apk"
          unzip -t "$apk" >/dev/null
          unzip -Z1 "$apk" > "$RUNNER_TEMP/apk-entry-names.txt"
          for tilesheet in default_16x16 geoduck_15x25 nevanda_32x32 overlays; do
            grep -Fxq "res/drawable-nodpi-v4/${tilesheet}.png" "$RUNNER_TEMP/apk-entry-names.txt"
          done
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump resources "$apk" > "$RUNNER_TEMP/apk-compiled-resources.txt"
          grep -Fq 'nevanda_32x32' "$RUNNER_TEMP/apk-compiled-resources.txt"
          grep -Fq 'geoduck_15x25' "$RUNNER_TEMP/apk-compiled-resources.txt"
          grep -Fq 'default_16x16' "$RUNNER_TEMP/apk-compiled-resources.txt"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/tutorial-apk-certificate.txt"
          cat "$RUNNER_TEMP/tutorial-apk-certificate.txt"
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/tutorial-apk-certificate.txt" | tr -d '\r')"
          test "$actual" = "ab65aa9dd3984387346d15cdc20f388487457a32acba5e93f65d114beb4bd1dc"
          echo "APK uses pinned long-lived certificate: $actual"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -E '^package:|^native-code:'
          test -n "$(unzip -Z1 "$apk" | grep 'lib/arm64-v8a/.*\.so$')"
          cp "$apk" "$RUNNER_TEMP/NetHack5-TutorialMode-arm64-stable.apk"
          sha256sum "$RUNNER_TEMP/NetHack5-TutorialMode-arm64-stable.apk"

      - name: Upload directly installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NetHack5-TutorialMode-arm64-stable-test
          path: ${{ runner.temp }}/NetHack5-TutorialMode-arm64-stable.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK download in a separate tutorial preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view tutorial-preview >/dev/null 2>&1; then
            gh release create tutorial-preview --target "$GITHUB_SHA" --prerelease \
              --title 'NetHack 5 — Offline Tutorial Mode (stable test certificate)' \
              --notes 'Offline, preview-inspired Tutorial Mode. ARM64 Android test build. STABLE TEST-SIGNED with the pinned project-specific public certificate (SHA-256 AB65AA9DD3984387346D15CDC20F388487457A32ACBA5E93F65D114BEB4BD1DC). Future APK updates signed using this certificate should install over this version. Older debug APKs used disposable keys and REQUIRE a one-time data-preserving migration. Back up saves before that transition. The test signing keystore is publicly available; do not use it for security-sensitive applications. Physical-device testing is still required.'
          fi
          gh release upload tutorial-preview "$RUNNER_TEMP/NetHack5-TutorialMode-arm64-stable.apk" --clobber
